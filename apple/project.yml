name: SyncSpaceApple
options:
  bundleIdPrefix: app.syncspace
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  SyncSpaceCore:
    type: framework
    platform: [iOS, macOS]
    sources: [Sources/SyncSpaceCore]
  SyncSpaceiOS:
    type: application
    platform: iOS
    sources: [Sources/SyncSpaceApp]
    dependencies:
      - target: SyncSpaceCore
    info:
      path: Configuration/iOS-Info.plist
    entitlements:
      path: Configuration/iOS.entitlements
  SyncSpacemacOS:
    type: application
    platform: macOS
    sources: [Sources/SyncSpaceApp]
    dependencies:
      - target: SyncSpaceCore
    info:
      path: Configuration/macOS-Info.plist
    entitlements:
      path: Configuration/macOS.entitlements
schemes:
  SyncSpaceiOS:
    build:
      targets: { SyncSpaceiOS: all }
    run: { config: Debug }
  SyncSpacemacOS:
    build:
      targets: { SyncSpacemacOS: all }
    run: { config: Debug }
