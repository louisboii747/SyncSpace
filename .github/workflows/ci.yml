name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l backend)"
          if [[ -n "$unformatted" ]]; then
            printf 'These Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test frontend and build embedded assets
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Build commands
        run: go build ./backend/cmd/server ./backend/cmd/syncspace

  transfer-smoke:
    name: Two-device transfer smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Pair isolated devices and transfer real bytes
        run: go run ./backend/cmd/syncspace dev verify

  linux-package-smoke:
    name: Linux package smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream binutils build-essential cpio desktop-file-utils file libgtk-3-dev libwebkit2gtk-4.1-dev rpm shellcheck

      - name: Build Debian and RPM packages
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash packaging/linux/build-packages.sh \
            --version 0.0.0 \
            --arch amd64 \
            --format all \
            --output dist

      - name: Inspect package metadata and payloads
        run: |
          bash packaging/linux/verify-package.sh dist/syncspace_0.0.0_amd64.deb
          bash packaging/linux/verify-package.sh dist/syncspace-0.0.0-1.x86_64.rpm

  windows-package-smoke:
    name: Windows executable smoke test
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build embedded frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows release assets
        shell: pwsh
        run: ./packaging/windows/build-windows.ps1 -Version 0.0.0 -Architecture amd64 -SkipFrontend

      - name: Verify executable versions
        shell: pwsh
        run: |
          function Get-EmbeddedVersion([string] $Path) {
            $resolvedPath = (Resolve-Path -LiteralPath $Path).Path
            $stdoutPath = Join-Path $env:RUNNER_TEMP ("syncspace-version-{0}.out" -f [guid]::NewGuid())
            $stderrPath = Join-Path $env:RUNNER_TEMP ("syncspace-version-{0}.err" -f [guid]::NewGuid())
            try {
              # GUI-subsystem executables must be explicitly awaited for their
              # redirected version output to be complete.
              $process = Start-Process -FilePath $resolvedPath -ArgumentList '--version' -Wait -PassThru -NoNewWindow `
                -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
              $output = ((Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue) | Out-String).Trim()
              $errorOutput = ((Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue) | Out-String).Trim()
            } finally {
              Remove-Item -LiteralPath $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
            }
            if ($process.ExitCode -ne 0) { throw "$Path --version failed: $errorOutput" }
            $match = [regex]::Match($output, '(?m)^(?:SyncSpace\s+)?(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)\s*$')
            if (-not $match.Success) { throw "Could not read version from $Path output: $output" }
            return $match.Groups['version'].Value
          }
          if ((Get-EmbeddedVersion ./dist/windows/syncspace-0.0.0-windows-amd64.exe) -ne '0.0.0') { throw 'Desktop version mismatch' }

      - name: Smoke-test native window lifecycle
        shell: pwsh
        env:
          SYNCSPACE_DATA_DIR: ${{ runner.temp }}\syncspace-desktop-data
        run: |
          $desktop = Start-Process -FilePath ./dist/windows/syncspace-0.0.0-windows-amd64.exe -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $desktop.Refresh()
              if ($desktop.HasExited) { throw 'Native desktop exited during startup' }
              try {
                Invoke-RestMethod http://127.0.0.1:8384/api/v1/privacy-policy | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Native desktop did not start its backend' }
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
          }
